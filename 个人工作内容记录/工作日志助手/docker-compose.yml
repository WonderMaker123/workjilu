version: "3.8"

services:
  server:
    image: ${DOCKER_IMAGE_SERVER:-wndfl/worklog-server:latest}
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: worklog-server
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3001
      # 生产环境务必修改为随机长字符串
      - JWT_SECRET=${JWT_SECRET:-please-change-me-in-production}
      - JWT_EXPIRES_IN=7d
      - DATABASE_URL=file:/app/data/worklog.db
    volumes:
      - worklog-data:/app/data
      - worklog-uploads:/app/uploads
    expose:
      - "3001"

  web:
    image: ${DOCKER_IMAGE_WEB:-wndfl/worklog-web:latest}
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: worklog-web
    restart: unless-stopped
    depends_on:
      - server
    environment:
      - VITE_API_BASE=/api
    ports:
      - "${WEB_PORT:-5080}:80"
      # - "443:443"   # 若启用 HTTPS 请自行配置

volumes:
  worklog-data:
  worklog-uploads:
